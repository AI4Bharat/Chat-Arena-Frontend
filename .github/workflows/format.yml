name: Auto Format

on:
  pull_request:
    branches: [master, develop]

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Chat-Arena-Frontend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Chat-Arena-Frontend/package-lock.json

      - run: npm ci

      - run: npm run format

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'style: auto-format with prettier'
